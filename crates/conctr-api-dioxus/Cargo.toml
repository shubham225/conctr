[package]
name        = "conctr-api-dioxus"
version     = "0.1.0"
authors     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
publish     = { workspace = true }
repository  = { workspace = true }

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }

conctr-api.workspace = true
subtle = { version = "2", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
dioxus-fullstack-core = { version = "0.7", optional = true }

tempfile = { version = "3", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
http = { version = "1", optional = true }

[features]
server = ["dioxus/server", "conctr-api/storage", "dep:tempfile", "dep:uuid", "dep:http", "dep:subtle", "dep:tokio", "dep:dioxus-fullstack-core"]
