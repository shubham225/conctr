[package]
name = "conctr-design-system"
version = "0.2.0"
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
publish = false
[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
conctr-ui-dioxus = { workspace = true, features = ["showcase"] }
icons = { version = "0.19", features = ["dioxus"] }
[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server", "conctr-ui-dioxus/server"]
