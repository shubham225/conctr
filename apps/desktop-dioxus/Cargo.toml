[package]
name       = "conctr-desktop-dioxus"
version    = { workspace = true }
authors    = { workspace = true }
edition    = { workspace = true }
license    = { workspace = true }
publish    = { workspace = true }
repository = { workspace = true }

[dependencies]
conctr-app-dioxus = { workspace = true }
dioxus            = { workspace = true, features = ["router", "fullstack"] }
icons             = { version = "0.19", features = ["dioxus"] }
image             = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
default = []
desktop = [
    "dioxus/desktop",
    "conctr-app-dioxus/native-client",
    "dep:image",
]
server  = ["dioxus/server", "conctr-app-dioxus/server"]
