[package]
name       = "conctr-desktop-dioxus"
version    = { workspace = true }
authors    = { workspace = true }
edition    = { workspace = true }
license    = { workspace = true }
publish    = { workspace = true }
repository = { workspace = true }

[dependencies]
dioxus            = { workspace = true, features = ["router", "fullstack"] }
conctr-app-dioxus = { workspace = true }

[features]
default = []
desktop = ["dioxus/desktop", "conctr-app-dioxus/native-client"]
server  = ["dioxus/server", "conctr-app-dioxus/server"]
